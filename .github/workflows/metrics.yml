name: GitHub Metrics

on:
  # 每天 00:00 UTC（即北京时间早上 8:00）自动更新一次
  schedule: [{ cron: "0 0 * * *" }]
  # 也可以在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: static/github-metrics.svg
          user: CJY719HNU
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 1
          config_timezone: Asia/Shanghai
